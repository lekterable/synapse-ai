name: Commitlint

# CI lints the PR title on every run, so this only catches a title edited after
# the last push. Pushes, body-only edits and drafts start no job.
on:
  pull_request:
    branches: [master]
    types: [edited]

jobs:
  conventional-commits:
    name: Conventional Commits
    permissions:
      contents: read
    uses: lekterable/perfekt/.github/workflows/commitlint.yml@master
