name: CI

# Actions minutes: pull requests only, since a merge to master re-runs code the
# PR already checked. Drafts start no job (mark the PR ready once), a new push
# cancels the older run, and the shared job lints the PR title too.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: lekterable/perfekt/.github/workflows/ci.yml@master
